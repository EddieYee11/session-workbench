plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'work.eddie.sessions'
 compileSdk 35
 defaultConfig { applicationId 'work.eddie.sessions'; minSdk 28; targetSdk 35; versionCode 7; versionName '1.3.3'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildFeatures { buildConfig true; compose true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildTypes {
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
  }
  // Device acceptance uses release optimizations with the existing local test
  // certificate, so installing an update preserves pairing and conversations.
  benchmark {
   initWith release
   signingConfig signingConfigs.debug
   matchingFallbacks = ['release']
   debuggable false
  }
 }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.work:work-runtime-ktx:2.9.1'
 implementation 'io.noties.markwon:core:4.6.2'
 implementation 'io.noties.markwon:ext-tables:4.6.2'
 implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
 implementation 'io.noties.markwon:linkify:4.6.2'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
