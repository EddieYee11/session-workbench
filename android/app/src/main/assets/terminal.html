<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="xterm.css"><style>html,body{margin:0;width:100vw;height:100vh;background:#151b24;overflow:hidden}#status{height:24px;color:#a6b6c9;font:12px sans-serif;padding:7px 12px 0;box-sizing:border-box}#term{position:fixed;top:28px;bottom:0;left:8px;right:8px}#history{display:none;position:fixed;inset:0;background:#151b24;color:#dde5ef;overflow:hidden;z-index:5}#historyHead{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#202936;font:14px sans-serif}#historyHead button{min-width:64px;min-height:44px;border:0;border-radius:22px;background:#3c4b60;color:white;font:14px sans-serif}#historyTerm{position:absolute;top:64px;bottom:0;left:8px;right:8px}</style></head><body><div id="status">正在连接原会话…</div><div id="term"></div><div id="history"><div id="historyHead"><span>终端回看 · 最多最近 20,000 行</span><button type="button" onclick="window.historyEnd()">最新</button></div><div id="historyTerm"></div></div><script src="xterm.js"></script><script src="addon-fit.js"></script><script>
const config=JSON.parse(Native.configuration());let socket,ctrl=false,closed=false,retry;
const terminalTheme={background:'#151b24',foreground:'#dde5ef',cursor:'#83adff',selectionBackground:'#44556e'};
const t=new Terminal({fontSize:13,fontFamily:'monospace',cursorBlink:true,scrollback:20000,theme:terminalTheme,allowProposedApi:false});const fit=new FitAddon.FitAddon();t.loadAddon(fit);t.open(document.getElementById('term'));
let historyT=null,historyFit=null;function historyTerminal(){if(!historyT){historyT=new Terminal({fontSize:t.options.fontSize,fontFamily:'monospace',disableStdin:true,scrollback:20000,theme:terminalTheme,allowProposedApi:false});historyFit=new FitAddon.FitAddon();historyT.loadAddon(historyFit);historyT.open(document.getElementById('historyTerm'))}historyFit.fit();return historyT}
function send(o){if(socket&&socket.readyState===1)socket.send(JSON.stringify(o));}
function resize(){try{fit.fit();send({type:'resize',cols:t.cols,rows:t.rows});}catch(e){}}
function connect(){socket=new WebSocket(config.base.replace(/^https:/,'wss:')+'/terminal/'+encodeURIComponent(config.sid));socket.binaryType='arraybuffer';socket.onopen=()=>{send({token:config.token});resize();document.getElementById('status').textContent='同一远端会话 · 终端已连接';t.focus()};socket.onmessage=e=>{if(e.data instanceof ArrayBuffer)t.write(new Uint8Array(e.data));else t.write(e.data)};socket.onclose=e=>{document.getElementById('status').textContent=e.code===1008?'会话不可连接，请返回检查状态':'连接中断，正在重连…';if(!closed&&e.code!==1008)retry=setTimeout(connect,2000)};}
t.onData(data=>{if(ctrl&&data.length===1){data=String.fromCharCode(data.toUpperCase().charCodeAt(0)&31);ctrl=false;document.getElementById('status').textContent='同一远端会话 · 终端已连接'}send({type:'input',data})});
window.openHistory=()=>{const h=document.getElementById('history');h.style.display='block';const viewer=historyTerminal();viewer.reset();viewer.write('正在读取终端历史…');setTimeout(()=>{try{const data=JSON.parse(Native.history());viewer.reset();viewer.write((data.text||'当前没有可回看的输出').replace(/\r?\n/g,'\r\n'),()=>{viewer.scrollToLine(Math.max(0,viewer.buffer.active.length-viewer.rows-Math.floor(viewer.rows/2)))})}catch(e){viewer.reset();viewer.write('读取失败：'+e.message)}},0)};
window.historyEnd=()=>{document.getElementById('history').style.display='none';t.focus()};
let touchStart=null;document.addEventListener('touchstart',e=>{if(document.getElementById('history').style.display==='block'||e.touches.length!==1)return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},true);
document.addEventListener('touchcancel',()=>{touchStart=null},true);document.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;touchStart=null;if(dy< -70&&Math.abs(dx)<70)window.openHistory()},true);
window.pasteText=text=>{if(text)t.paste(text);t.focus()};window.selectedText=()=>document.getElementById('history').style.display==='block'&&historyT?historyT.getSelection():t.getSelection();
window.key=data=>{if(data==='HISTORY'){window.openHistory();return}const arrows={UP:'A',DOWN:'B',RIGHT:'C',LEFT:'D'};if(arrows[data])data='\x1b'+(t.modes.applicationCursorKeysMode?'O':'[')+arrows[data];if(data==='MODEL'){t.paste('/model');send({type:'input',data:'\r'});t.focus();return;}if(data==='CTRL'){ctrl=!ctrl;document.getElementById('status').textContent=ctrl?'Ctrl 已按下，请输入下一个键':'同一远端会话 · 终端已连接';t.focus();return}if(data==='SMALL'||data==='LARGE'){t.options.fontSize=Math.max(9,Math.min(24,t.options.fontSize+(data==='LARGE'?1:-1)));if(historyT){historyT.options.fontSize=t.options.fontSize;historyFit.fit()}resize();return}send({type:'input',data});t.focus()};new ResizeObserver(resize).observe(document.getElementById('term'));window.addEventListener('beforeunload',()=>{closed=true;clearTimeout(retry);socket?.close()});connect();
</script></body></html>
