# The backend follows a compact house style (short one-liners, semicolons, late
# imports for optional modules); these settings describe the existing code.
line-length = 240
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E401", "E402", "E501", "E701", "E702", "E741"]
